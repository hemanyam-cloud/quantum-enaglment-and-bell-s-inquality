<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    input[type=range] { accent-color: var(--primary, #3b82f6); }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 text-xs select-none">
  <div class="py-2 space-y-3 max-w-full">
    <!-- Header Readout -->
    <div class="flex items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="font-bold tracking-tight text-sm">CHSH Quantum Witness</span>
        <span id="violationBadge" class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/15 text-emerald-500 border border-emerald-500/30">
          Quantum Nonlocal
        </span>
      </div>
      <div class="flex items-baseline gap-1 font-mono">
        <span class="text-xs text-[var(--muted-foreground)]">S =</span>
        <span id="sVal" class="text-base font-bold text-[var(--primary)] tabular-nums">2.8284</span>
        <span class="text-[10px] text-[var(--muted-foreground)]">/ 2.8284</span>
      </div>
    </div>

    <!-- Interactive Sliders Grid -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Alice Angles -->
      <div class="space-y-1.5 p-2 rounded bg-[var(--card)] border border-[var(--card-border)]">
        <div class="font-semibold text-[11px] text-[var(--muted-foreground)] flex justify-between">
          <span>Alice Settings</span>
          <span class="font-mono text-[10px]">Basis A, A'</span>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <label for="angA">Angle a</label>
            <span id="lblA" class="font-mono tabular-nums text-[var(--foreground)]">0°</span>
          </div>
          <input id="angA" type="range" min="-180" max="180" value="0" class="w-full h-1.5 bg-zinc-700/30 rounded cursor-pointer" />
        </div>
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <label for="angAPrime">Angle a'</label>
            <span id="lblAPrime" class="font-mono tabular-nums text-[var(--foreground)]">90°</span>
          </div>
          <input id="angAPrime" type="range" min="-180" max="180" value="90" class="w-full h-1.5 bg-zinc-700/30 rounded cursor-pointer" />
        </div>
      </div>

      <!-- Bob Angles -->
      <div class="space-y-1.5 p-2 rounded bg-[var(--card)] border border-[var(--card-border)]">
        <div class="font-semibold text-[11px] text-[var(--muted-foreground)] flex justify-between">
          <span>Bob Settings</span>
          <span class="font-mono text-[10px]">Basis B, B'</span>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <label for="angB">Angle b</label>
            <span id="lblB" class="font-mono tabular-nums text-[var(--foreground)]">45°</span>
          </div>
          <input id="angB" type="range" min="-180" max="180" value="45" class="w-full h-1.5 bg-zinc-700/30 rounded cursor-pointer" />
        </div>
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <label for="angBPrime">Angle b'</label>
            <span id="lblBPrime" class="font-mono tabular-nums text-[var(--foreground)]">-45°</span>
          </div>
          <input id="angBPrime" type="range" min="-180" max="180" value="-45" class="w-full h-1.5 bg-zinc-700/30 rounded cursor-pointer" />
        </div>
      </div>
    </div>

    <!-- Depolarizing Noise Slider & Correlator Readouts -->
    <div class="p-2 rounded bg-[var(--card)] border border-[var(--card-border)] space-y-2">
      <div class="flex justify-between items-center">
        <span class="font-semibold text-[11px]">Global Depolarizing Noise (p)</span>
        <span id="lblNoise" class="font-mono text-[11px] text-[var(--primary)] font-bold">0.0%</span>
      </div>
      <input id="noiseP" type="range" min="0" max="100" value="0" step="0.5" class="w-full h-1.5 bg-zinc-700/30 rounded cursor-pointer" />

      <!-- Progress Meter for Bounds -->
      <div class="pt-1 space-y-1">
        <div class="flex justify-between text-[10px] text-[var(--muted-foreground)] font-mono">
          <span>Classical: 2.0</span>
          <span>Crit Noise: 29.3%</span>
          <span>Entangle: 66.7%</span>
          <span>Tsirelson: 2.828</span>
        </div>
        <div class="relative w-full h-2 rounded-full bg-zinc-800/40 overflow-hidden border border-[var(--card-border)]">
          <div class="absolute top-0 bottom-0 left-[70.7%] w-0.5 bg-amber-500/80 z-10" title="Classical Limit (2.0 / 2.8284)"></div>
          <div id="meterFill" class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 transition-all duration-75" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Correlators & Preset Buttons -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-[var(--card-border)]">
      <div class="flex items-center gap-2 font-mono text-[10px]">
        <span class="text-[var(--muted-foreground)]">E(a,b): <b id="eAB" class="text-[var(--foreground)]">+0.707</b></span>
        <span class="text-[var(--muted-foreground)]">E(a,b'): <b id="eABp" class="text-[var(--foreground)]">+0.707</b></span>
        <span class="text-[var(--muted-foreground)]">E(a',b): <b id="eApB" class="text-[var(--foreground)]">+0.707</b></span>
        <span class="text-[var(--muted-foreground)]">E(a',b'): <b id="eApBp" class="text-[var(--foreground)]">-0.707</b></span>
      </div>

      <div class="flex items-center gap-1">
        <button id="btnOptimal" class="px-2 py-1 rounded bg-[var(--card)] hover:bg-[var(--card-border)] border border-[var(--card-border)] text-[10px] transition-colors">
          Optimal Bell
        </button>
        <button id="btnCritNoise" class="px-2 py-1 rounded bg-[var(--card)] hover:bg-[var(--card-border)] border border-[var(--card-border)] text-[10px] transition-colors">
          p = 29.3%
        </button>
        <button id="btnMaxEnt" class="px-2 py-1 rounded bg-[var(--card)] hover:bg-[var(--card-border)] border border-[var(--card-border)] text-[10px] transition-colors">
          p = 66.7%
        </button>
      </div>
    </div>
  </div>

  <script>
    const elA = document.getElementById('angA');
    const elAPrime = document.getElementById('angAPrime');
    const elB = document.getElementById('angB');
    const elBPrime = document.getElementById('angBPrime');
    const elNoise = document.getElementById('noiseP');

    const lblA = document.getElementById('lblA');
    const lblAPrime = document.getElementById('lblAPrime');
    const lblB = document.getElementById('lblB');
    const lblBPrime = document.getElementById('lblBPrime');
    const lblNoise = document.getElementById('lblNoise');

    const sVal = document.getElementById('sVal');
    const badge = document.getElementById('violationBadge');
    const meterFill = document.getElementById('meterFill');

    const eAB = document.getElementById('eAB');
    const eABp = document.getElementById('eABp');
    const eApB = document.getElementById('eApB');
    const eApBp = document.getElementById('eApBp');

    function calcCorrelator(aDeg, bDeg, p) {
      const rad = ((aDeg - bDeg) * Math.PI) / 180;
      return (1 - p) * Math.cos(rad);
    }

    function update() {
      const a = parseFloat(elA.value);
      const ap = parseFloat(elAPrime.value);
      const b = parseFloat(elB.value);
      const bp = parseFloat(elBPrime.value);
      const p = parseFloat(elNoise.value) / 100;

      lblA.textContent = a + '°';
      lblAPrime.textContent = ap + '°';
      lblB.textContent = b + '°';
      lblBPrime.textContent = bp + '°';
      lblNoise.textContent = (p * 100).toFixed(1) + '%';

      const E_ab = calcCorrelator(a, b, p);
      const E_abp = calcCorrelator(a, bp, p);
      const E_apb = calcCorrelator(ap, b, p);
      const E_apbp = calcCorrelator(ap, bp, p);

      const S = Math.abs(E_ab + E_abp + E_apb - E_apbp);

      eAB.textContent = (E_ab >= 0 ? '+' : '') + E_ab.toFixed(3);
      eABp.textContent = (E_abp >= 0 ? '+' : '') + E_abp.toFixed(3);
      eApB.textContent = (E_apb >= 0 ? '+' : '') + E_apb.toFixed(3);
      eApBp.textContent = (E_apbp >= 0 ? '+' : '') + E_apbp.toFixed(3);

      sVal.textContent = S.toFixed(4);

      const tsirelson = 2 * Math.SQRT2;
      const pct = Math.min(100, Math.max(0, (S / tsirelson) * 100));
      meterFill.style.width = pct.toFixed(1) + '%';

      if (S > 2.0001) {
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/15 text-emerald-500 border border-emerald-500/30';
        badge.textContent = 'Quantum Nonlocal (+ ' + (((S - 2.0) / 2.0) * 100).toFixed(1) + '%)';
      } else if (p < 0.6667) {
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/15 text-amber-500 border border-amber-500/30';
        badge.textContent = 'Entangled (Local Realist)';
      } else {
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-semibold bg-zinc-500/15 text-zinc-400 border border-zinc-500/30';
        badge.textContent = 'Separable (Classical)';
      }
    }

    [elA, elAPrime, elB, elBPrime, elNoise].forEach(input => {
      input.addEventListener('input', update);
    });

    document.getElementById('btnOptimal').addEventListener('click', () => {
      elA.value = 0; elAPrime.value = 90; elB.value = 45; elBPrime.value = -45; elNoise.value = 0;
      update();
    });

    document.getElementById('btnCritNoise').addEventListener('click', () => {
      elA.value = 0; elAPrime.value = 90; elB.value = 45; elBPrime.value = -45; elNoise.value = 29.3;
      update();
    });

    document.getElementById('btnMaxEnt').addEventListener('click', () => {
      elA.value = 0; elAPrime.value = 90; elB.value = 45; elBPrime.value = -45; elNoise.value = 66.7;
      update();
    });

    update();
  </script>
</body>
</html>
